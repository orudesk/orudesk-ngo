# Runs the tests on every push to main and on every pull request, with the core's shared edition workflow:
# the API tests against the core in ../orudesk, the contract and web checks, and the image build.
# See orudesk/orudesk/.github/workflows/edition-ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: orudesk/orudesk/.github/workflows/edition-ci.yml@main
    with:
      edition: orudesk-ngo
