# Runs when you push a tag like v1.0.0: tests this edition against the core release named in
# gradle.properties (orudeskVersion), then pushes the image to ghcr.io/orudesk/orudesk-ngo.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: orudesk-ngo
      - name: Check the tag matches gradle.properties, and find the core version
        id: v
        working-directory: orudesk-ngo/api
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but gradle.properties says $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "core=$(grep '^orudeskVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      # The core at its release tag, not main: a release is built from released code only.
      - uses: actions/checkout@v7
        with:
          repository: orudesk/orudesk
          ref: v${{ steps.v.outputs.core }}
          path: orudesk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        working-directory: orudesk-ngo/api
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: orudesk-ngo/api/Dockerfile
          push: true
          tags: |
            ghcr.io/orudesk/orudesk-ngo:${{ steps.v.outputs.version }}
            ghcr.io/orudesk/orudesk-ngo:latest
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: orudesk-ngo
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Orudesk NGO $GITHUB_REF_NAME" --notes-file release-notes.md
