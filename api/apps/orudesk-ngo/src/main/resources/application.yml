spring:
  application:
    name: orudesk-ngo
  modulith:
    events:
      # Stuck this long in one state: marked FAILED, so the core's retry picks it up (core Day 54)
      staleness:
        published: 15m
        processing: 15m
        resubmitted: 15m

  # Java 21+ virtual threads: each request gets a cheap virtual thread instead of one from Tomcat's pool of 200.
  threads:
    virtual:
      enabled: true

  # Load a local .env file if there is one (optional: production has no file).
  # [.properties] tells Spring to read it as KEY=value lines.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orudesk}
    username: ${DB_USERNAME:orudesk_app}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000   # ms: fail fast with a 503 when the database is down (see the core's Day 36)

  jpa:
    hibernate:
      ddl-auto: validate                     # Flyway owns the schema, never Hibernate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Give up quickly when Redis is unreachable, instead of hanging every request for a minute.
      connect-timeout: 2s
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  # Behind Caddy (or any proxy on a private network), take the client's address and scheme from X-Forwarded-*.
  # Tomcat trusts those headers only from private and loopback addresses (the core's Day 66).
  forward-headers-strategy: native

orudesk:
  identity:
    # Until the tenant comes from the logged-in user (step 11), new users join this one: the demo tenant from V4.
    default-tenant-id: ${ORUDESK_DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
    # Optional: the first ADMIN, created at startup if both are set (see FirstAdminInitializer).
    first-admin:
      email: ${ORUDESK_ADMIN_EMAIL:}
      password: ${ORUDESK_ADMIN_PASSWORD:}
    # How long a password reset link works (core Day 53)
    password-reset:
      ttl: ${ORUDESK_PASSWORD_RESET_TTL:30m}
    # Two-factor sign-in: the key that encrypts authenticator app secrets, 32 bytes in base64
    # (openssl rand -base64 32). Empty: two-factor sign-in is not offered. Keep it as safe as the database backups.
    mfa:
      key: ${ORUDESK_MFA_KEY:}
  security:
    jwt:
      # The key that signs access tokens. At least 32 characters, never committed: set it in .env.
      secret: ${ORUDESK_JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
  # The outbox (core Days 51 and 54): completed work kept a week; failed work retried 1, 2, 4... minutes apart
  events:
    keep-completed: ${ORUDESK_EVENTS_KEEP_COMPLETED:7d}
    retry:
      first-backoff: ${ORUDESK_EVENTS_RETRY_FIRST_BACKOFF:1m}
      max-attempts: ${ORUDESK_EVENTS_RETRY_MAX_ATTEMPTS:10}
  # The NGO's own details, printed on every donation receipt (Day 57)
  ngo:
    name: ${ORUDESK_NGO_NAME:Orudesk NGO}
    address: ${ORUDESK_NGO_ADDRESS:}
    pan: ${ORUDESK_NGO_PAN:}
    # The 80G approval number. Empty: receipts say donations are not tax-deductible.
    registration-80g: ${ORUDESK_NGO_REGISTRATION_80G:}
  web:
    # Where the web app is, for links in emails (welcome, password reset), without a trailing slash
    base-url: ${ORUDESK_WEB_BASE_URL:http://localhost:5173}
  mail:
    # Who emails come from. The server is spring.mail.host / port / username / password (SPRING_MAIL_HOST...):
    # without a host, emails are written to the log instead of sent.
    from: ${ORUDESK_MAIL_FROM:Orudesk <no-reply@orudesk.local>}

# Actuator: the same probes as the core's standard edition (see its application.yml for the why).
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db
  health:
    redis:
      enabled: false

# The OpenAPI contract, sorted and indented so it diffs cleanly (the web app's client is generated from it)
springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
